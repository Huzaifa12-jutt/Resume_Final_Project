<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon-96x96.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="TalentLense - AI-powered resume screening and candidate ranking platform. Find the right talent faster with AI." />
  <meta name="theme-color" content="#4f46e5" />
  <meta property="og:title" content="TalentLense | AI-Powered Hiring" />
  <meta property="og:description"
    content="Screen resumes, rank candidates, and hire faster with AI-powered matching." />
  <meta property="og:type" content="website" />
  <meta name="twitter:title" content="TalentLense | AI-Powered Hiring" />
  <meta name="twitter:description"
    content="Screen resumes, rank candidates, and hire faster with AI-powered matching." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400..700&display=swap"
    rel="stylesheet">

  <title>TalentLense | AI-Powered Resume Screening</title>
  <script>
    // Set theme-color on scroll for PWA
    document.addEventListener('scroll', function () {
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) {
        meta.content = window.scrollY > 50 ? '#ffffff' : '#4f46e5';
      }
    });
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
